  const parseDate = (s) => { const [y,m,d] = s.slice(0,10).split('-').map(Number); return new Date(y, m-1, d); };
  const fmtShort = (s) => { const d = parseDate(s); return MONTHS[d.getMonth()] + ' ' + d.getDate(); };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    const d = parseDate(it.due);
    let s = DAYS[d.getDay()] + ' ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
    if (it.due.length > 10) {
      const [h, m] = it.due.slice(11, 16).split(':').map(Number);
      const hh = ((h + 11) % 12) + 1, ap = h >= 12 ? 'PM' : 'AM';
      s += ', ' + hh + ':' + pad(m) + ' ' + ap;
    }
    return s;
  };
  const today = new Date(); today.setHours(0,0,0,0);
  const relDays = (it) => Math.round((parseDate(it.due) - today) / MS_DAY);
  const rel = (n) => n < 0 ? (-n) + 'd ago' : n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + 'd';

  const items = D.items;
  const courseByKey = Object.fromEntries(D.courses.map((c) => [c.key, c]));
  const courseTag = (it) => '<span class="course" style="background:var(--' + it.course + '-soft);color:var(--' + it.course + ')">' + esc(it.label) + '</span>';

  $('lede').innerHTML = 'Every graded deadline across <strong>' + D.courses.length + ' courses</strong> (' + items.length + ' items total), collated from each course site. Class sessions and lectures are left out on purpose.';

  const upcoming = items.filter((it) => relDays(it) >= 0).sort((a,b) => a.due.localeCompare(b.due));

  const tiles = [
    { label: 'Next due', value: next ? rel(relDays(next)) : '\u2014', sub: next ? '[' + next.label + '] ' + next.title : 'nothing pending', urgent: next && relDays(next) <= 2 },
    { label: 'Due in next 7 days', value: String(upcoming.filter((it) => relDays(it) <= 7).length), sub: overdue.length ? overdue.length + ' overdue' : 'nothing overdue', urgent: overdue.length > 0 },
    { label: 'Exams ahead', value: String(examsLeft.length), sub: examsLeft[0] ? fmtWhen(examsLeft[0]) + ' \u00b7 ' + examsLeft[0].label : '\u2014' },
    { label: 'Tracked this semester', value: String(items.length), sub: D.courses.map((c) => c.label).join(' \u00b7 ') },
  ];
  $('tiles').innerHTML = tiles.map((t) => '<div class="tile"><div class="label">' + esc(t.label) + '</div><div class="value">' + esc(t.value) + '</div><div class="sub' + (t.urgent ? ' urgent' : '') + '">' + esc(t.sub) + '</div></div>').join('');

  // weekly stacked chart (Monday-start weeks spanning the tracked range)
  const first = parseDate(items[0].due);
  const last = parseDate(items[items.length - 1].due);
  const wkStart = new Date(first); wkStart.setDate(wkStart.getDate() - ((wkStart.getDay() + 6) % 7));
  const weeks = [];
  for (let d = new Date(wkStart); d <= last; d.setDate(d.getDate() + 7)) weeks.push(new Date(d));
  const bins = weeks.map(() => Object.fromEntries(D.courses.map((c) => [c.key, 0])));
  items.forEach((it) => {
    const d = parseDate(it.due);
    const idx = Math.floor((d - wkStart) / (7 * MS_DAY));
    if (bins[idx]) bins[idx][it.course]++;
  });
  const maxCount = Math.max(1, ...bins.map((b) => D.courses.reduce((s,c) => s + b[c.key], 0)));
  $('chart').style.setProperty('--n', weeks.length);
  $('chart').innerHTML = bins.map((b) => {
    const total = D.courses.reduce((s,c) => s + b[c.key], 0);
    const h = Math.round(100 * total / maxCount);
    const segs = D.courses.filter((c) => b[c.key] > 0).map((c) => '<div class="seg" style="height:' + Math.round(100 * b[c.key] / Math.max(total,1)) + '%;background:var(--' + c.key + ')" title="' + esc(c.label) + ': ' + b[c.key] + '"></div>').join('');
    return '<div class="col" style="height:' + h + '%">' + segs + '</div>';
  }).join('');
  $('weekaxis').style.setProperty('--n', weeks.length);
  $('weekaxis').innerHTML = weeks.map((w) => '<span>' + fmtShort(w.toISOString().slice(0,10)) + '</span>').join('');
  $('legend').innerHTML = D.courses.map((c) => '<span class="chip"><i style="background:var(--' + c.key + ')"></i>' + esc(c.label) + ' \u00b7 ' + esc(c.name) + '</span>').join('');

  // next up
  const list = overdue.sort((a,b) => a.due.localeCompare(b.due)).concat(upcoming).slice(0, 8);
  $('nextup').innerHTML = list.map((it) => {
    const n = relDays(it);
    return '<li><span class="rel' + (n <= 3 ? ' soon' : '') + '">' + rel(n) + '</span>' + courseTag(it)
      + '<span class="item"><span class="title">' + (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' : esc(it.title)) + '</span>' + (it.tentative ? ' <span class="tent">(tentative)</span>' : '') + '</span>'
      + '<span class="when">' + esc(fmtWhen(it)) + '</span></li>';
  }).join('');

  // filters + table
  let activeFilter = 'all';
  const filters = [{key:'all', label:'All'}].concat(D.courses.map((c) => ({key:c.key, label:c.label})));
  $('filters').innerHTML = filters.map((f) => '<button type="button" data-key="' + f.key + '" aria-pressed="' + (f.key === 'all') + '">' + esc(f.label) + '</button>').join('');
  function renderTable() {
    const rows = items.filter((it) => activeFilter === 'all' || it.course === activeFilter).slice().sort((a,b) => a.due.localeCompare(b.due));
    $('table-summary').textContent = (activeFilter === 'all' ? 'All ' : courseByKey[activeFilter].name + ' ') + rows.length + ' deadline' + (rows.length === 1 ? '' : 's');
    $('table').querySelector('tbody').innerHTML = rows.map((it) => {
      const n = relDays(it);
      return '<tr class="' + (n < 0 ? 'past' : '') + '"><td class="mono">' + esc(fmtWhen(it)) + '</td><td>' + courseTag(it) + '</td><td>' + (it.url ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>' : esc(it.title)) + (it.tentative ? ' <span class="tent">*</span>' : '') + '</td><td class="mono">' + esc(it.type) + '</td></tr>';
    }).join('');
  }
  $('filters').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    activeFilter = b.dataset.key;
    $('filters').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderTable();
  });
  renderTable();

  $('footer').innerHTML = '<p>Generated ' + esc(D.generated) + ' from each course\u2019s public site (LLM Systems, Deep RL, AI Agents) and the shared capstone summary. * = date not yet confirmed by the course. Times shown in Eastern.</p>';
})();
</script> </body> </html>
